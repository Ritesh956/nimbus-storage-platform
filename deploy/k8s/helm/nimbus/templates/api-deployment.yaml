apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: nimbus-api
  template:
    metadata:
      labels:
        app: nimbus-api
    spec:
      containers:
        - name: nimbus-api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nimbus-config
            - secretRef:
                name: nimbus-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-api
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: nimbus-api
  ports:
    - port: 8080
      nodePort: {{ .Values.api.nodePort }}
