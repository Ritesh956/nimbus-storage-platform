apiVersion: batch/v1
kind: Job
metadata:
  name: nimbus-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image.migrate }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # DSN inlined rather than read from the nimbus-config ConfigMap:
          # pre-install hooks run before the chart's other resources are
          # created, so this can't depend on it existing yet.
          args:
            - "-path"
            - "/migrations"
            - "-database"
            - "postgres://nimbus:nimbus@postgres.{{ .Values.namespace }}.svc.cluster.local:5432/nimbus?sslmode=disable"
            - "up"
