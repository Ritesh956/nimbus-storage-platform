apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-web
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: nimbus-web
  template:
    metadata:
      labels:
        app: nimbus-web
    spec:
      containers:
        - name: nimbus-web
          image: {{ .Values.image.web }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-web
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: nimbus-web
  ports:
    - port: 3000
      nodePort: {{ .Values.web.nodePort }}
