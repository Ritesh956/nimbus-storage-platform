# Was a stub (docs/03-hld.md §3) until deploy/k8s/infra/metrics-server.yaml
# was added — apply.sh now installs metrics-server before this chart, so
# `kubectl get hpa` reports a real CPU percentage instead of <unknown> and
# this can actually scale nimbus-api 1→3 replicas under real load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nimbus-api
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nimbus-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
