# The scrape config ConfigMap is generated from deploy/observability/prometheus.yml
# by apply.sh (kubectl create configmap --from-file), not duplicated here —
# the targets (nimbus-api:8080, nimbus-worker:8080) resolve the same way
# via k8s Service DNS as they do via Compose's container-name DNS, so the
# same file works unmodified in both environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: nimbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: nimbus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      nodePort: 30909
