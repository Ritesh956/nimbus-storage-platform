# No PVC — matches deploy/docker-compose.yml's redis service, which is
# also unvolumed. Everything Redis holds here (blacklist keys, node-health
# TTL keys, the health-change pubsub channel) is ephemeral/recomputable by
# design (docs/00-project-state.md's design-decisions list), so losing it
# on a pod restart isn't a correctness problem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nimbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nimbus
spec:
  selector:
    app: redis
  ports:
    - port: 6379
