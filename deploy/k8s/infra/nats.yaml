# No PVC — matches deploy/docker-compose.yml's nats service (also
# unvolumed): JetStream data is in-container ephemeral storage there too,
# a pre-existing simplification this doesn't change, not a new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: nimbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nimbus
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
