# Grafana Tempo config (roadmap #14 — trace backend for the OpenTelemetry
# spans nimbus-api/nimbus-worker now emit, internal/platform/tracing).
# Single-binary, local-disk storage — same "dev/demo-grade, not
# production-hardened" bar as the rest of deploy/observability (no object
# storage backend, no multi-tenant auth); mounted identically by both
# Compose and deploy/k8s/infra/tempo.yaml, one source of truth for either
# environment (same pattern prometheus.yml/grafana's provisioning already use).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h
