name: nimbus

services:
  # Resource limits below (deploy.resources.limits) are real, enforced caps
  # under Compose V2 even outside Swarm mode — not just documentation. Sized
  # generously for a local dev/demo stack (bound a runaway container, don't
  # throttle real usage); tighten before anything resembling production load.
  #
  # Port bindings: services no client outside this machine's containers ever
  # needs to reach (Postgres, Redis, NATS, the MinIO consoles, Mailpit,
  # Tempo, Prometheus, Grafana) are bound to 127.0.0.1 only — previously
  # 0.0.0.0, meaning a bare port-forward or tunnel alongside the app ports
  # would have exposed them (and their shared dev credentials) publicly.
  # nimbus-api/nimbus-web and the MinIO S3 API ports stay open on all
  # interfaces: the API/web are the actual public surface, and the S3 API
  # ports are what presigned upload/download URLs need to reach from a
  # browser (including one going through the Cloudflare tunnel setup).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring, per docs/07-distributed-architecture.md §3
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Storage nodes run standalone (NOT MinIO distributed mode) — Nimbus's own
  # storage module owns placement/replication/failover. See
  # docs/02-system-design.md §1 for why.
  #
  # Each node's S3 API port (9000/9010/9020) stays open on all interfaces —
  # presigned PUT/GET URLs need to reach it directly from a browser. The
  # console port (900x1) is admin-only and now loopback-bound.
  minio-node-1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio1:/data"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  minio-node-2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9010:9000", "127.0.0.1:9011:9001"]
    volumes: ["minio2:/data"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  minio-node-3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9020:9000", "127.0.0.1:9021:9001"]
    volumes: ["minio3:/data"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # SMTP catcher for password-reset email (backlog #14): accepts any mail on
  # 1025 and shows it in a web UI on 8025 — nothing ever leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  # Trace backend for the OpenTelemetry spans nimbus-api/nimbus-worker emit
  # (roadmap #14, internal/platform/tracing) — queried by Grafana's Tempo
  # datasource below, same instance the existing dashboards live in.
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["../backend/migrations:/migrations"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["-path", "/migrations", "-database", "postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable", "up"]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  nimbus-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      NIMBUS_POSTGRES_DSN: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_REDIS_ADDR: redis:6379
      NIMBUS_NATS_URL: nats://nats:4222
      NIMBUS_STORAGE_NODES: ${NIMBUS_STORAGE_NODES:-node-1=http://minio-node-1:9000|http://localhost:9000,node-2=http://minio-node-2:9000|http://localhost:9010,node-3=http://minio-node-3:9000|http://localhost:9020}
      NIMBUS_MINIO_ACCESS_KEY: nimbus
      NIMBUS_MINIO_SECRET_KEY: nimbus-secret
      NIMBUS_SMTP_ADDR: mailpit:1025
      NIMBUS_OTEL_EXPORTER_ENDPOINT: tempo:4318
      # NIMBUS_ADMIN_EMAIL / NIMBUS_ADMIN_PASSWORD (the sole seeded
      # platform-admin login, see auth.Repository.EnsureSeededAdmin) come
      # from .env, not here — they're real credentials, not fixed infra.
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      tempo: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  nimbus-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: .env
    environment:
      NIMBUS_POSTGRES_DSN: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_REDIS_ADDR: redis:6379
      NIMBUS_NATS_URL: nats://nats:4222
      NIMBUS_STORAGE_NODES: ${NIMBUS_STORAGE_NODES:-node-1=http://minio-node-1:9000|http://localhost:9000,node-2=http://minio-node-2:9000|http://localhost:9010,node-3=http://minio-node-3:9000|http://localhost:9020}
      NIMBUS_MINIO_ACCESS_KEY: nimbus
      NIMBUS_MINIO_SECRET_KEY: nimbus-secret
      NIMBUS_OTEL_EXPORTER_ENDPOINT: tempo:4318
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      tempo: { condition: service_started }
    deploy:
      resources:
        # Higher than nimbus-api: pdfium-WASM PDF thumbnail rendering
        # (processing.generatePDFThumbnail) is the single heaviest thing
        # either process does.
        limits: { cpus: "1.0", memory: 768M }

  nimbus-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server-side-only: app/api/auth/*'s route handlers proxy to nimbus-api
      # from inside this container, where "localhost" (NEXT_PUBLIC_API_URL,
      # baked in for the *browser's* use) doesn't resolve to it — same class
      # of footgun as presigned MinIO URLs, see lib/server/auth-proxy.ts.
      NIMBUS_API_INTERNAL_URL: http://nimbus-api:8080
    # Host 3010, not 3000 — this machine also runs an unrelated project's
    # native `next dev` on 3000; container-internal port is still 3000.
    ports: ["3010:3000"]
    depends_on:
      nimbus-api: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:13.1.3
    # Host 3001, not 3000 — 3000 is the frontend's port (see nimbus-web
    # below and README), Grafana's container-internal port is still 3000.
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nimbus
      # Alerting (audit roadmap item #9 — DLQ alert) routes its one contact
      # point through the same Mailpit catcher password-reset email already
      # uses (deploy/observability/grafana/provisioning/alerting/), so a
      # fired alert is visible at http://localhost:8025 with no real SMTP
      # relay required. Mailpit takes unauthenticated plaintext SMTP.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@nimbus.dev
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/nimbus
    depends_on: [prometheus, mailpit, tempo]
    deploy:
      resources:
        # 512M, not 256: a live `kubectl top` check against the kind
        # cluster's Grafana pod showed real usage already at ~306Mi.
        limits: { cpus: "0.5", memory: 512M }

volumes:
  pgdata:
  minio1:
  minio2:
  minio3:
  tempo-data:
