name: nimbus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring, per docs/07-distributed-architecture.md §3
    ports: ["4222:4222", "8222:8222"]

  # Storage nodes run standalone (NOT MinIO distributed mode) — Nimbus's own
  # storage module owns placement/replication/failover. See
  # docs/02-system-design.md §1 for why.
  minio-node-1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio1:/data"]

  minio-node-2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9010:9000", "9011:9001"]
    volumes: ["minio2:/data"]

  minio-node-3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
    ports: ["9020:9000", "9021:9001"]
    volumes: ["minio3:/data"]

  # SMTP catcher for password-reset email (backlog #14): accepts any mail on
  # 1025 and shows it in a web UI on 8025 — nothing ever leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports: ["8025:8025", "1025:1025"]

  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["../backend/migrations:/migrations"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["-path", "/migrations", "-database", "postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable", "up"]
    restart: "no"

  nimbus-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      NIMBUS_POSTGRES_DSN: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_REDIS_ADDR: redis:6379
      NIMBUS_NATS_URL: nats://nats:4222
      NIMBUS_STORAGE_NODES: ${NIMBUS_STORAGE_NODES:-node-1=http://minio-node-1:9000|http://localhost:9000,node-2=http://minio-node-2:9000|http://localhost:9010,node-3=http://minio-node-3:9000|http://localhost:9020}
      NIMBUS_MINIO_ACCESS_KEY: nimbus
      NIMBUS_MINIO_SECRET_KEY: nimbus-secret
      NIMBUS_SMTP_ADDR: mailpit:1025
      # NIMBUS_ADMIN_EMAIL / NIMBUS_ADMIN_PASSWORD (the sole seeded
      # platform-admin login, see auth.Repository.EnsureSeededAdmin) come
      # from .env, not here — they're real credentials, not fixed infra.
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  nimbus-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: .env
    environment:
      NIMBUS_POSTGRES_DSN: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_REDIS_ADDR: redis:6379
      NIMBUS_NATS_URL: nats://nats:4222
      NIMBUS_STORAGE_NODES: ${NIMBUS_STORAGE_NODES:-node-1=http://minio-node-1:9000|http://localhost:9000,node-2=http://minio-node-2:9000|http://localhost:9010,node-3=http://minio-node-3:9000|http://localhost:9020}
      NIMBUS_MINIO_ACCESS_KEY: nimbus
      NIMBUS_MINIO_SECRET_KEY: nimbus-secret
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  nimbus-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server-side-only: app/api/auth/*'s route handlers proxy to nimbus-api
      # from inside this container, where "localhost" (NEXT_PUBLIC_API_URL,
      # baked in for the *browser's* use) doesn't resolve to it — same class
      # of footgun as presigned MinIO URLs, see lib/server/auth-proxy.ts.
      NIMBUS_API_INTERNAL_URL: http://nimbus-api:8080
    # Host 3010, not 3000 — this machine also runs an unrelated project's
    # native `next dev` on 3000; container-internal port is still 3000.
    ports: ["3010:3000"]
    depends_on:
      nimbus-api: { condition: service_started }

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.1.3
    # Host 3001, not 3000 — 3000 is the frontend's port (see nimbus-web
    # below and README), Grafana's container-internal port is still 3000.
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nimbus
      # Alerting (audit roadmap item #9 — DLQ alert) routes its one contact
      # point through the same Mailpit catcher password-reset email already
      # uses (deploy/observability/grafana/provisioning/alerting/), so a
      # fired alert is visible at http://localhost:8025 with no real SMTP
      # relay required. Mailpit takes unauthenticated plaintext SMTP.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@nimbus.dev
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/nimbus
    depends_on: [prometheus, mailpit]

volumes:
  pgdata:
  minio1:
  minio2:
  minio3:
