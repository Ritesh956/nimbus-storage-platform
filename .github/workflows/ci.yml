name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit test
        run: go test ./... -short

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f deploy/Dockerfile.api -t nimbus-api:ci .
      - name: build worker image
        run: docker build -f deploy/Dockerfile.worker -t nimbus-worker:ci .
