name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit test
        run: go test ./... -short -coverprofile=/tmp/unit.cov -coverpkg=./...
      # Audit §14's other named "Improve": both languages already printed a
      # real number, but nothing failed a push for a coverage drop. This is
      # a regression floor, not an aspirational target — set just under the
      # real measured baseline (4.7% as of this revision; -coverpkg=./...
      # counts every statement in the repo, including untested cmd/*
      # binaries and thin platform/* helpers, which is why the total reads
      # far lower than any individual well-tested package's own number).
      - name: unit coverage summary
        run: |
          go tool cover -func=/tmp/unit.cov | tail -1
          pct=$(go tool cover -func=/tmp/unit.cov | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 4.0) { print "::error::unit coverage " pct "% dropped below the 4.0% floor"; exit 1 } }'
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
      # Roadmap #11 (§07/§10's "checked by hand each session" gap): fails
      # the build if docs/openapi.json doesn't match what cmd/openapi-gen
      # produces from the real route registrations right now — the one
      # thing that would otherwise let the spec silently drift the same way
      # docs/06-api-design.md used to.
      - name: openapi spec is up to date
        run: |
          go run ./cmd/openapi-gen -out /tmp/openapi.json
          diff -u ../docs/openapi.json /tmp/openapi.json || {
            echo "::error::docs/openapi.json is stale — regenerate with: (cd backend && go run ./cmd/openapi-gen -out ../docs/openapi.json)"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install, not npm ci — see CLAUDE.md's footgun note: this
      # lockfile's optional platform-specific packages can resolve
      # differently enough between platforms to trip npm ci's strict
      # lockfile-sync check even when nothing about the actual dependency
      # versions changed.
      - name: install deps
        run: npm install
      - name: audit
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      # Audit §14/§10: closes the "zero frontend tests" gap — Vitest +
      # React Testing Library, covering format.ts/sha256-stream.ts (verified
      # against Node's real crypto as an oracle)/upload.ts's resume state
      # machine plus EmptyState/ConfirmDialog component behavior. `test`
      # (not `test:watch`) runs once and exits, which is what CI needs.
      - name: test
        run: npm test
      # Roadmap #11's other half: frontend/lib/types.ts is now a thin
      # re-export over lib/api-schema.generated.ts (see that file's header)
      # instead of a hand-maintained mirror of the Go response shapes —
      # fails the build if the generated file doesn't match what
      # openapi-typescript produces from the checked-in docs/openapi.json
      # right now.
      - name: generated api types are up to date
        run: |
          npx openapi-typescript ../docs/openapi.json -o /tmp/api-schema.generated.ts
          diff -u lib/api-schema.generated.ts /tmp/api-schema.generated.ts || {
            echo "::error::frontend/lib/api-schema.generated.ts is stale — regenerate with: (cd frontend && npx openapi-typescript ../docs/openapi.json -o lib/api-schema.generated.ts)"
            exit 1
          }
      - name: build
        run: npm run build

  # Integration tests need real Postgres/Redis/MinIO/NATS, not mocks —
  # matching this project's "verify against the real thing" convention (see
  # CLAUDE.md). MinIO/NATS were added alongside the gc/events/sharing/org/
  # folder/file/search/quota test suites (audit §14) so those modules'
  # correctness claims are re-proved on every push, not just by manual smoke
  # scripts. Deliberately does NOT include scripts/chaos-node-kill.js or
  # scripts/load-upload.js: both need real multi-container infra (Compose
  # or kind) and real wall-clock time (the load test alone runs ~40s at 60
  # VUs), a different cost/value trade-off than a per-push CI gate. They
  # stay manual/local verification tools — see docs/00-project-state.md.
  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nimbus
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: run migrations
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/backend/migrations:/migrations"
          migrate/migrate:v4.17.1
          -path /migrations
          -database "postgres://nimbus:nimbus@localhost:5432/nimbus?sslmode=disable"
          up
      # gc and events integration tests need a real chunk store / broker, not
      # mocks (same "verify against the real thing" convention as
      # Postgres/Redis above) — single node/instance is enough, the
      # ring/replication behavior itself is already covered by
      # storage.ring_test.go. Run as plain `docker run -d`, not a `services:`
      # entry: GitHub Actions' services block has no way to pass the command
      # args both images need (`server /data`, `-js`) — same reason the
      # migration step above is a raw `docker run` rather than a service.
      - name: start minio
        run: >-
          docker run -d --network host --name test-minio
          -e MINIO_ROOT_USER=nimbus -e MINIO_ROOT_PASSWORD=nimbus-secret
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address :9001
      - name: start nats
        run: docker run -d --network host --name test-nats nats:2-alpine -js -m 8222
      - name: wait for minio and nats
        run: |
          for i in $(seq 1 20); do curl -sf http://localhost:9000/minio/health/live && break; [ "$i" = 20 ] && { echo "minio never came up"; docker logs test-minio; exit 1; }; sleep 1; done
          for i in $(seq 1 20); do curl -sf http://localhost:8222/healthz && break; [ "$i" = 20 ] && { echo "nats never came up"; docker logs test-nats; exit 1; }; sleep 1; done
      - name: integration test
        working-directory: backend
        env:
          NIMBUS_TEST_POSTGRES_DSN: postgres://nimbus:nimbus@localhost:5432/nimbus?sslmode=disable
          NIMBUS_TEST_REDIS_ADDR: localhost:6379
          NIMBUS_TEST_MINIO_ENDPOINT: localhost:9000
          NIMBUS_TEST_MINIO_ACCESS_KEY: nimbus
          NIMBUS_TEST_MINIO_SECRET_KEY: nimbus-secret
          NIMBUS_TEST_NATS_URL: nats://localhost:4222
        run: go test -tags=integration -coverprofile=/tmp/integration.cov -coverpkg=./... ./...
      # Same regression-floor reasoning as build-test's unit coverage step —
      # set just under the real measured baseline (22.7% as of this
      # revision, same -coverpkg=./... caveat about the repo-wide
      # denominator).
      - name: integration coverage summary
        working-directory: backend
        run: |
          go tool cover -func=/tmp/integration.cov | tail -1
          pct=$(go tool cover -func=/tmp/integration.cov | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 20.0) { print "::error::integration coverage " pct "% dropped below the 20.0% floor"; exit 1 } }'

  # Audit §15's standout remaining gap: four from-scratch image builds on
  # every push, and helm-smoke-deploy (below) rebuilds the identical four
  # Dockerfiles from the identical source again on top of that — doubling
  # the from-scratch cost per push. Both jobs now build via buildx with the
  # GitHub Actions cache backend (type=gha), keyed by image name (`scope`)
  # rather than by job, so a layer either job populates is reusable by the
  # other — one Go/npm dependency layer, built once, serves both.
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          tags: nimbus-api:ci
          load: true
          cache-from: type=gha,scope=nimbus-api
          cache-to: type=gha,mode=max,scope=nimbus-api
      - name: build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          tags: nimbus-worker:ci
          load: true
          cache-from: type=gha,scope=nimbus-worker
          cache-to: type=gha,mode=max,scope=nimbus-worker
      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          tags: nimbus-web:ci
          load: true
          cache-from: type=gha,scope=nimbus-web
          cache-to: type=gha,mode=max,scope=nimbus-web
      - name: build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          tags: nimbus-migrate:ci
          load: true
          cache-from: type=gha,scope=nimbus-migrate
          cache-to: type=gha,mode=max,scope=nimbus-migrate

  # Closes the audit's "Helm chart isn't in CI" gap (docs/00's item 26, the
  # audit's §15/§19 row 13) — the chart was previously trusted entirely on
  # the strength of the last manual `helm install`, and that trust was
  # broken once already (a kind cluster ran ~34-day-stale images because
  # nothing forced a rebuild+reload). helm lint/template run first as a fast
  # fail; the kind deploy proves the chart actually reaches a healthy
  # cluster, not just that it renders.
  helm-smoke-deploy:
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      - name: helm lint
        run: helm lint deploy/k8s/helm/nimbus

      - name: helm template
        run: helm template nimbus deploy/k8s/helm/nimbus

      # Pinned kind/kubectl versions, not "latest" — same reasoning as
      # roadmap #2's image-tag pinning (§16): a CI gate that silently
      # changes behavior on someone else's release schedule isn't a
      # trustworthy gate.
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nimbus
          config: deploy/k8s/kind-config.yaml
          version: v0.32.0
          kubectl_version: v1.36.1

      - uses: docker/setup-buildx-action@v3

      # Same four images docker-build validates, tagged to match
      # values.yaml's defaults (pullPolicy: Never expects them local, not
      # pulled) rather than the :ci tag docker-build uses. Same GHA cache
      # scopes as docker-build's equivalent steps (see that job's comment) —
      # whichever of the two parallel jobs populates a layer first, the
      # other reuses it instead of rebuilding from scratch.
      - name: build images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          tags: nimbus-api:latest
          load: true
          cache-from: type=gha,scope=nimbus-api
          cache-to: type=gha,mode=max,scope=nimbus-api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          tags: nimbus-worker:latest
          load: true
          cache-from: type=gha,scope=nimbus-worker
          cache-to: type=gha,mode=max,scope=nimbus-worker
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          tags: nimbus-web:latest
          load: true
          cache-from: type=gha,scope=nimbus-web
          cache-to: type=gha,mode=max,scope=nimbus-web
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          tags: nimbus-migrate:latest
          load: true
          cache-from: type=gha,scope=nimbus-migrate
          cache-to: type=gha,mode=max,scope=nimbus-migrate

      - name: load images into kind
        run: kind load docker-image nimbus-api:latest nimbus-worker:latest nimbus-web:latest nimbus-migrate:latest --name nimbus

      # Same script the documented local recipe (CLAUDE.md) uses — infra
      # isn't part of the Helm chart (deploy/k8s/helm/nimbus/Chart.yaml's
      # own doc comment: "stateful infra ... intentionally not in this
      # chart"), so it has to be applied before `helm install` either way.
      - name: apply stateful infra
        run: bash deploy/k8s/infra/apply.sh

      - name: helm install
        run: helm install nimbus deploy/k8s/helm/nimbus -n nimbus --wait --timeout 5m

      - name: verify rollout
        run: |
          kubectl -n nimbus rollout status deployment/nimbus-api --timeout=120s
          kubectl -n nimbus rollout status deployment/nimbus-worker --timeout=120s
          kubectl -n nimbus rollout status deployment/nimbus-web --timeout=120s

      # kind-config.yaml's extraPortMappings put the NodePorts on these
      # host ports — the same URLs the documented local recipe uses.
      # --retry-all-errors (not just --retry-connrefused): a fresh pod's
      # NodePort route can reset the first connection while kube-proxy is
      # still propagating iptables rules, which curl treats as error 56
      # (Recv failure), not connection-refused — --retry-connrefused alone
      # doesn't cover that and let one flaky reset fail the whole job.
      - name: smoke check health endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/healthz
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/readyz
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health

      - name: dump cluster state on failure
        if: failure()
        run: |
          kubectl -n nimbus get pods -o wide
          kubectl -n nimbus describe pods
          kubectl -n nimbus logs -l app=nimbus-api --tail=300 --all-containers || true
          kubectl -n nimbus logs -l app=nimbus-worker --tail=300 --all-containers || true
          kubectl -n nimbus logs -l app=nimbus-web --tail=300 --all-containers || true
          kubectl -n nimbus logs job/nimbus-migrate --tail=300 || true
