name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit test
        run: go test ./... -short
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install, not npm ci — see CLAUDE.md's footgun note: this
      # lockfile's optional platform-specific packages can resolve
      # differently enough between platforms to trip npm ci's strict
      # lockfile-sync check even when nothing about the actual dependency
      # versions changed.
      - name: install deps
        run: npm install
      - name: audit
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build

  # Integration tests need real Postgres/Redis, not mocks — matching this
  # project's "verify against the real thing" convention (see CLAUDE.md).
  # Deliberately does NOT include scripts/chaos-node-kill.js or
  # scripts/load-upload.js: both need real multi-container infra (Compose
  # or kind) and real wall-clock time (the load test alone runs ~40s at 60
  # VUs), a different cost/value trade-off than a per-push CI gate. They
  # stay manual/local verification tools — see docs/00-project-state.md.
  integration-test:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nimbus
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: run migrations
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/backend/migrations:/migrations"
          migrate/migrate:v4.17.1
          -path /migrations
          -database "postgres://nimbus:nimbus@localhost:5432/nimbus?sslmode=disable"
          up
      - name: integration test
        working-directory: backend
        env:
          NIMBUS_TEST_POSTGRES_DSN: postgres://nimbus:nimbus@localhost:5432/nimbus?sslmode=disable
          NIMBUS_TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=integration ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f deploy/Dockerfile.api -t nimbus-api:ci .
      - name: build worker image
        run: docker build -f deploy/Dockerfile.worker -t nimbus-worker:ci .
      - name: build web image
        run: docker build -f deploy/Dockerfile.web -t nimbus-web:ci .
      - name: build migrate image
        run: docker build -f deploy/Dockerfile.migrate -t nimbus-migrate:ci .

  # Closes the audit's "Helm chart isn't in CI" gap (docs/00's item 26, the
  # audit's §15/§19 row 13) — the chart was previously trusted entirely on
  # the strength of the last manual `helm install`, and that trust was
  # broken once already (a kind cluster ran ~34-day-stale images because
  # nothing forced a rebuild+reload). helm lint/template run first as a fast
  # fail; the kind deploy proves the chart actually reaches a healthy
  # cluster, not just that it renders.
  helm-smoke-deploy:
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      - name: helm lint
        run: helm lint deploy/k8s/helm/nimbus

      - name: helm template
        run: helm template nimbus deploy/k8s/helm/nimbus

      # Pinned kind/kubectl versions, not "latest" — same reasoning as
      # roadmap #2's image-tag pinning (§16): a CI gate that silently
      # changes behavior on someone else's release schedule isn't a
      # trustworthy gate.
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nimbus
          config: deploy/k8s/kind-config.yaml
          version: v0.32.0
          kubectl_version: v1.36.1

      # Same four images docker-build validates, tagged to match
      # values.yaml's defaults (pullPolicy: Never expects them local, not
      # pulled) rather than the :ci tag docker-build uses.
      - name: build images
        run: |
          docker build -f deploy/Dockerfile.api -t nimbus-api:latest .
          docker build -f deploy/Dockerfile.worker -t nimbus-worker:latest .
          docker build -f deploy/Dockerfile.web -t nimbus-web:latest .
          docker build -f deploy/Dockerfile.migrate -t nimbus-migrate:latest .

      - name: load images into kind
        run: kind load docker-image nimbus-api:latest nimbus-worker:latest nimbus-web:latest nimbus-migrate:latest --name nimbus

      # Same script the documented local recipe (CLAUDE.md) uses — infra
      # isn't part of the Helm chart (deploy/k8s/helm/nimbus/Chart.yaml's
      # own doc comment: "stateful infra ... intentionally not in this
      # chart"), so it has to be applied before `helm install` either way.
      - name: apply stateful infra
        run: bash deploy/k8s/infra/apply.sh

      - name: helm install
        run: helm install nimbus deploy/k8s/helm/nimbus -n nimbus --wait --timeout 5m

      - name: verify rollout
        run: |
          kubectl -n nimbus rollout status deployment/nimbus-api --timeout=120s
          kubectl -n nimbus rollout status deployment/nimbus-worker --timeout=120s
          kubectl -n nimbus rollout status deployment/nimbus-web --timeout=120s

      # kind-config.yaml's extraPortMappings put the NodePorts on these
      # host ports — the same URLs the documented local recipe uses.
      - name: smoke check health endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/healthz
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/readyz
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health

      - name: dump cluster state on failure
        if: failure()
        run: |
          kubectl -n nimbus get pods -o wide
          kubectl -n nimbus describe pods
          kubectl -n nimbus logs -l app=nimbus-api --tail=300 --all-containers || true
          kubectl -n nimbus logs -l app=nimbus-worker --tail=300 --all-containers || true
          kubectl -n nimbus logs -l app=nimbus-web --tail=300 --all-containers || true
          kubectl -n nimbus logs job/nimbus-migrate --tail=300 || true
